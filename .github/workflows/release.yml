name: release
on: { push: { tags: ['v*'] } }
permissions: { contents: write, id-token: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci && npm run validate && npm run build && npm test
      - name: version must match tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: publish to npm (skipped when this version is already on the registry)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "launchpad-registry@$V" version >/dev/null 2>&1; then echo "launchpad-registry@$V is already published, skipping"; else npm publish --provenance --access public; fi
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/launchpads.json
            dist/launchpads.min.json
            dist/addresses.json
            dist/launchpads.csv
          generate_release_notes: true
