name: pr-check-comment
on: { pull_request: {} }
permissions: { pull-requests: write, contents: read }
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - id: v
        run: |
          set +e
          OUT=$(node scripts/validate.mjs 2>&1); CODE=$?
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- registry | tr '\n' ' ')
          echo "code=$CODE" >> $GITHUB_OUTPUT
          { echo 'out<<EOF'; echo "$OUT"; echo EOF; } >> $GITHUB_OUTPUT
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
      - uses: actions/github-script@v9
        with:
          script: |
            const ok = '${{ steps.v.outputs.code }}' === '0';
            const body = `### ${ok ? '✅' : '❌'} registry check\n\n**changed:** ${'${{ steps.v.outputs.changed }}' || '(no registry files)'}\n\n\`\`\`\n${process.env.OUT}\n\`\`\`\n\n${ok ? 'Reminder: every address needs a `sources` link and `npm run build` output committed.' : 'Fix the errors above, then push again.'}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes('registry check'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body }); else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
        env: { OUT: '${{ steps.v.outputs.out }}' }
      - run: exit ${{ steps.v.outputs.code }}
