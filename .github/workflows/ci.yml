name: validate
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: dist must be committed up to date
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale — run 'npm run build' and commit" && exit 1)
